# CI: se ejecuta en cada pull request y en cada push a main.
# Los nombres de los jobs son los checks que exige el ruleset de main; si cambian, hay que actualizar el ruleset.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, formato y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

  # Los jobs de los recorridos en navegador (e2e-simulado y e2e-real) los añade la tarea T19 de la 004.

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
