# nginx de la SPA (ADR-0020, ADR-0022). Es el único punto de entrada del navegador: sirve la SPA y reenvía /bff/ y /api/
# al BFF, que vive en el mismo origen (la cookie de sesión es SameSite=Strict).

# RNF-04: se registra $uri y no $request, para que una consulta (?...) nunca quede en el log.
log_format sin_consulta '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
  # Dentro de server: reemplaza el access_log del nginx.conf de la imagen, que sí usa $request.
  access_log /var/log/nginx/access.log sin_consulta;

  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include snippets/encabezados.conf;

  # CL-11: la pantalla de entrada nunca se guarda, así "atrás" no puede mostrar una versión vieja con datos.
  location = /index.html {
    include snippets/encabezados.conf;
    add_header Cache-Control "no-store" always;
  }

  # Los archivos con hash en el nombre no cambian nunca.
  location /assets/ {
    include snippets/encabezados.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # BFF y API: el BFF recibe el Host que vio el navegador (localhost:5173) para emitir la cookie y las redirecciones.
  location /bff/ {
    include snippets/encabezados.conf;
    proxy_pass http://bff:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
  }

  location /api/ {
    include snippets/encabezados.conf;
    proxy_pass http://bff:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
  }

  # Cualquier otra ruta es de la SPA (React Router): se entrega index.html.
  location / {
    include snippets/encabezados.conf;
    try_files $uri /index.html;
  }
}
